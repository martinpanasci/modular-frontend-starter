version: 2
updates:
  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly
    groups:
      next-and-react:
        patterns:
          ["next", "react", "react-dom", "eslint-config-next", "@next/*"]
      testing:
        patterns:
          [
            "vitest",
            "vite",
            "@vitejs/*",
            "@testing-library/*",
            "@playwright/*",
            "jsdom",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
